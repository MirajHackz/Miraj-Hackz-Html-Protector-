<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HTML Protector Pro | Miraj Hackz</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#02050a;
    --panel:rgba(10,16,27,.78);
    --panel2:#070c14;
    --line:rgba(255,255,255,.09);
    --cyan:#00eaff;
    --blue:#1677ff;
    --green:#00ffa8;
    --purple:#9b6cff;
    --red:#ff4f70;
    --text:#f7faff;
    --muted:#7b899d;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow-x:hidden;

    color:var(--text);

    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(0,234,255,.13),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 80%,
            rgba(155,108,255,.13),
            transparent 32%
        ),
        var(--bg);
}

/* =================================
   ANIMATED BACKGROUND
================================= */

.background{
    position:fixed;
    inset:0;
    z-index:-10;
    overflow:hidden;
    pointer-events:none;
}

.grid{
    position:absolute;
    inset:0;

    opacity:.13;

    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size:42px 42px;
}

.orb{
    position:absolute;

    border-radius:50%;

    filter:blur(100px);

    opacity:.14;

    animation:
        floatOrb 12s ease-in-out infinite alternate;
}

.orb.one{
    width:420px;
    height:420px;

    background:#00eaff;

    left:-180px;
    top:-180px;
}

.orb.two{
    width:450px;
    height:450px;

    background:#7c3aed;

    right:-220px;
    bottom:-180px;

    animation-delay:2s;
}

@keyframes floatOrb{
    from{
        transform:translate(0,0) scale(1);
    }

    to{
        transform:translate(60px,40px) scale(1.15);
    }
}

/* PARTICLES */

.particle{
    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:var(--cyan);

    box-shadow:
        0 0 10px var(--cyan);

    opacity:.5;

    animation:
        particleMove linear infinite;
}

.p1{
    left:10%;
    bottom:-10px;
    animation-duration:9s;
}

.p2{
    left:25%;
    bottom:-10px;
    animation-duration:13s;
}

.p3{
    left:43%;
    bottom:-10px;
    animation-duration:11s;
}

.p4{
    left:67%;
    bottom:-10px;
    animation-duration:15s;
}

.p5{
    left:84%;
    bottom:-10px;
    animation-duration:10s;
}

@keyframes particleMove{
    from{
        transform:translateY(0);
        opacity:0;
    }

    15%{
        opacity:.6;
    }

    to{
        transform:translateY(-110vh);
        opacity:0;
    }
}

/* =================================
   HEADER
================================= */

header{
    text-align:center;

    padding:
        45px 18px 32px;
}

.badge{
    display:inline-flex;

    align-items:center;

    gap:8px;

    padding:8px 16px;

    border-radius:50px;

    color:var(--cyan);

    background:
        rgba(0,234,255,.04);

    border:
        1px solid rgba(0,234,255,.18);

    font-size:10px;

    font-weight:900;

    letter-spacing:1.5px;

    box-shadow:
        0 0 25px rgba(0,234,255,.04);
}

.badge-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--green);

    box-shadow:
        0 0 12px var(--green);

    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    50%{
        opacity:.3;
        transform:scale(.7);
    }
}

.logo{
    position:relative;

    width:90px;
    height:90px;

    margin:22px auto;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:28px;

    background:
        linear-gradient(
            135deg,
            #00eaff,
            #1266ff
        );

    font-size:42px;

    box-shadow:
        0 0 50px rgba(0,234,255,.25),
        inset 0 0 30px rgba(255,255,255,.15);

    animation:
        logoFloat 4s ease-in-out infinite;
}

.logo:before{
    content:"";

    position:absolute;

    inset:-7px;

    border-radius:34px;

    border:
        1px solid rgba(0,234,255,.35);

    animation:
        logoRing 2.5s linear infinite;
}

@keyframes logoFloat{
    50%{
        transform:translateY(-6px);
    }
}

@keyframes logoRing{
    from{
        transform:rotate(0deg);
        opacity:.8;
    }

    to{
        transform:rotate(360deg);
        opacity:.2;
    }
}

header h1{
    font-size:
        clamp(35px,7vw,62px);

    line-height:1;

    font-weight:950;

    letter-spacing:-3px;

    background:
        linear-gradient(
            100deg,
            #fff 10%,
            var(--cyan) 50%,
            #fff 90%
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}

.subtitle{
    margin-top:13px;

    color:var(--muted);

    font-size:14px;
}

.developer{
    margin-top:17px;

    color:#536075;

    font-size:12px;
}

.developer strong{
    color:var(--green);
}

/* =================================
   CONTAINER
================================= */

.container{
    width:min(1180px,94%);

    margin:auto;
}

/* =================================
   STATS
================================= */

.stats{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:10px;

    margin-bottom:15px;
}

.stat{
    padding:17px 10px;

    text-align:center;

    border:
        1px solid var(--line);

    border-radius:18px;

    background:
        rgba(255,255,255,.025);

    backdrop-filter:blur(18px);

    transition:.25s;
}

.stat:hover{
    transform:
        translateY(-4px);

    border-color:
        rgba(0,234,255,.3);

    box-shadow:
        0 15px 30px rgba(0,0,0,.2);
}

.stat-icon{
    font-size:19px;

    margin-bottom:6px;
}

.stat strong{
    display:block;

    font-size:13px;
}

.stat span{
    display:block;

    margin-top:4px;

    color:var(--muted);

    font-size:10px;
}

/* =================================
   MAIN APP
================================= */

.app{
    position:relative;

    padding:23px;

    border:
        1px solid var(--line);

    border-radius:29px;

    background:
        linear-gradient(
            145deg,
            rgba(14,23,38,.9),
            rgba(4,8,15,.9)
        );

    backdrop-filter:blur(25px);

    box-shadow:
        0 35px 110px rgba(0,0,0,.48);

    overflow:hidden;
}

.app:before{
    content:"";

    position:absolute;

    top:0;
    left:0;
    right:0;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--cyan),
            transparent
        );

    opacity:.6;
}

.app-header{
    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:20px;
}

.app-title{
    display:flex;

    align-items:center;

    gap:10px;

    font-size:16px;

    font-weight:900;
}

.live-dot{
    width:9px;
    height:9px;

    border-radius:50%;

    background:var(--green);

    box-shadow:
        0 0 14px var(--green);

    animation:pulse 1.4s infinite;
}

.security{
    padding:7px 12px;

    border-radius:20px;

    color:var(--green);

    background:
        rgba(0,255,168,.04);

    border:
        1px solid rgba(0,255,168,.12);

    font-size:9px;

    font-weight:900;
}

/* =================================
   DROP AREA
================================= */

.drop-zone{
    margin-bottom:17px;

    padding:15px;

    text-align:center;

    border:
        1px dashed
        rgba(0,234,255,.2);

    border-radius:15px;

    background:
        rgba(0,234,255,.025);

    color:#647287;

    font-size:11px;

    transition:.25s;
}

.drop-zone.dragover{
    border-color:var(--cyan);

    background:
        rgba(0,234,255,.08);

    color:var(--cyan);

    box-shadow:
        0 0 25px rgba(0,234,255,.08);
}

.file-label{
    display:inline-block;

    margin-left:5px;

    color:var(--cyan);

    cursor:pointer;

    font-weight:900;
}

#fileInput{
    display:none;
}

/* =================================
   EDITORS
================================= */

.editors{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:15px;
}

.editor-title{
    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:9px;

    color:#b8c4d6;

    font-size:10px;

    font-weight:900;

    letter-spacing:.7px;
}

.counter{
    color:#4d5b70;
}

textarea{
    width:100%;

    height:360px;

    padding:18px;

    resize:vertical;

    outline:none;

    border:
        1px solid #1c2a3d;

    border-radius:17px;

    background:
        linear-gradient(
            145deg,
            #02050a,
            #040810
        );

    color:var(--green);

    font-family:
        "Courier New",
        monospace;

    font-size:12px;

    line-height:1.65;

    transition:.25s;
}

textarea:focus{
    border-color:
        rgba(0,234,255,.55);

    box-shadow:
        0 0 0 3px
        rgba(0,234,255,.04),

        0 0 35px
        rgba(0,234,255,.07);
}

textarea::placeholder{
    color:#354256;
}

/* =================================
   ACTIONS
================================= */

.actions{
    display:grid;

    grid-template-columns:
        1.5fr 1fr 1fr 1fr 1fr;

    gap:9px;

    margin-top:15px;
}

.btn{
    position:relative;

    min-height:50px;

    border:
        1px solid var(--line);

    border-radius:13px;

    color:#fff;

    cursor:pointer;

    font-size:11px;

    font-weight:900;

    overflow:hidden;

    transition:.22s;
}

.btn:before{
    content:"";

    position:absolute;

    top:0;
    left:-120%;

    width:80%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.18),
            transparent
        );

    transform:skewX(-20deg);

    transition:.6s;
}

.btn:hover:before{
    left:130%;
}

.btn:hover{
    transform:
        translateY(-3px);

    border-color:
        rgba(0,234,255,.45);

    box-shadow:
        0 12px 30px rgba(0,0,0,.3);
}

.btn:active{
    transform:scale(.97);
}

.protect{
    background:
        linear-gradient(
            135deg,
            #00b8d6,
            #1268ff
        );
}

.minify{
    background:#142238;
}

.copy{
    background:
        linear-gradient(
            135deg,
            #07815b,
            #00a97c
        );
}

.download{
    background:
        linear-gradient(
            135deg,
            #6639d9,
            #9654ff
        );
}

.reset{
    background:
        linear-gradient(
            135deg,
            #8d293e,
            #c53851
        );
}

/* =================================
   STATUS
================================= */

.status{
    min-height:27px;

    padding-top:10px;

    color:var(--green);

    font-size:11px;

    font-weight:900;
}

/* =================================
   PROTECTION ANIMATION
================================= */

.scan{
    display:none;

    position:relative;

    height:4px;

    margin-bottom:14px;

    overflow:hidden;

    border-radius:20px;

    background:
        rgba(255,255,255,.05);
}

.scan.active{
    display:block;
}

.scan:after{
    content:"";

    position:absolute;

    left:-30%;

    top:0;

    width:30%;

    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--cyan),
            transparent
        );

    box-shadow:
        0 0 15px var(--cyan);

    animation:
        scanning 1s linear infinite;
}

@keyframes scanning{
    to{
        left:100%;
    }
}

/* =================================
   PREVIEW
================================= */

.preview{
    margin-top:17px;

    overflow:hidden;

    border:
        1px solid var(--line);

    border-radius:18px;

    background:#05080d;
}

.preview-head{
    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:12px 15px;

    border-bottom:
        1px solid var(--line);

    color:#a8b4c5;

    font-size:10px;

    font-weight:900;
}

.preview-head button{
    border:0;

    background:none;

    color:var(--cyan);

    cursor:pointer;

    font-size:10px;

    font-weight:900;
}

iframe{
    display:block;

    width:100%;

    height:280px;

    border:0;

    background:#fff;
}

/* =================================
   INFO
================================= */

.info{
    margin-top:17px;

    padding:17px;

    border-radius:16px;

    background:
        rgba(0,234,255,.025);

    border:
        1px solid rgba(0,234,255,.08);

    color:#718096;

    font-size:11px;

    line-height:1.8;
}

.info b{
    color:var(--cyan);
}

/* =================================
   TELEGRAM
================================= */

.telegram{
    position:relative;

    width:min(820px,94%);

    margin:42px auto 25px;

    padding:42px 25px;

    text-align:center;

    border-radius:31px;

    border:
        1px solid rgba(34,158,217,.22);

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(34,158,217,.14),
            transparent 58%
        ),
        rgba(7,15,26,.93);

    box-shadow:
        0 30px 100px rgba(0,0,0,.43);

    overflow:hidden;
}

.telegram:after{
    content:"";

    position:absolute;

    width:200px;
    height:200px;

    left:-100px;
    top:-100px;

    border-radius:50%;

    background:#229ed9;

    filter:blur(110px);

    opacity:.12;
}

.tg-icon{
    position:relative;

    width:80px;
    height:80px;

    margin:auto auto 19px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:26px;

    background:
        linear-gradient(
            135deg,
            #2aa9e0,
            #087bb5
        );

    font-size:36px;

    box-shadow:
        0 0 45px
        rgba(34,158,217,.25);

    animation:
        telegramFloat 3s ease-in-out infinite;
}

@keyframes telegramFloat{
    50%{
        transform:translateY(-5px) rotate(2deg);
    }
}

.telegram h2{
    position:relative;

    font-size:27px;

    margin-bottom:10px;
}

.telegram p{
    position:relative;

    max-width:570px;

    margin:auto;

    color:var(--muted);

    line-height:1.7;

    font-size:13px;
}

.channel{
    position:relative;

    display:inline-block;

    margin:20px 0;

    padding:9px 20px;

    border-radius:30px;

    color:var(--cyan);

    background:
        rgba(0,234,255,.04);

    border:
        1px solid rgba(0,234,255,.12);

    font-size:13px;

    font-weight:900;
}

.telegram-button{
    position:relative;

    width:min(370px,100%);

    min-height:56px;

    margin:auto;

    display:flex;

    align-items:center;

    justify-content:center;

    color:white;

    text-decoration:none;

    border-radius:16px;

    background:
        linear-gradient(
            135deg,
            #229ed9,
            #087bb5
        );

    font-size:12px;

    font-weight:900;

    box-shadow:
        0 15px 40px
        rgba(34,158,217,.2);

    transition:.25s;
}

.telegram-button:hover{
    transform:
        translateY(-4px);

    box-shadow:
        0 20px 50px
        rgba(34,158,217,.32);
}

/* =================================
   FOOTER
================================= */

footer{
    text-align:center;

    padding:22px 15px 45px;

    color:#465267;

    font-size:10px;
}

footer strong{
    color:var(--cyan);
}

/* =================================
   TOAST
================================= */

.toast{
    position:fixed;

    left:50%;

    bottom:25px;

    z-index:9999;

    transform:
        translate(-50%,120px);

    min-width:250px;

    max-width:90%;

    padding:13px 18px;

    border-radius:14px;

    border:
        1px solid rgba(0,234,255,.2);

    background:
        rgba(7,14,24,.95);

    backdrop-filter:blur(20px);

    color:white;

    text-align:center;

    font-size:12px;

    font-weight:800;

    box-shadow:
        0 15px 50px rgba(0,0,0,.4);

    transition:.35s;
}

.toast.show{
    transform:
        translate(-50%,0);
}

/* =================================
   MOBILE
================================= */

@media(max-width:900px){

    .stats{
        grid-template-columns:
            repeat(2,1fr);
    }

    .editors{
        grid-template-columns:1fr;
    }

    .actions{
        grid-template-columns:
            repeat(2,1fr);
    }

    .protect{
        grid-column:span 2;
    }
}

@media(max-width:520px){

    header{
        padding-top:32px;
    }

    .logo{
        width:75px;
        height:75px;
        font-size:34px;
    }

    .app{
        padding:14px;
        border-radius:22px;
    }

    .security{
        display:none;
    }

    textarea{
        height:280px;
        font-size:11px;
    }

    .actions{
        grid-template-columns:1fr;
    }

    .protect{
        grid-column:auto;
    }

    .drop-zone{
        line-height:1.7;
    }

    .telegram{
        padding:32px 18px;
        border-radius:23px;
    }
}
</style>
</head>

<body>

<!-- BACKGROUND -->

<div class="background">

    <div class="grid"></div>

    <div class="orb one"></div>
    <div class="orb two"></div>

    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>

</div>


<!-- HEADER -->

<header>

    <div class="badge">
        <span class="badge-dot"></span>
        PREMIUM HTML SECURITY TOOL
    </div>

    <div class="logo">
        🛡️
    </div>

    <h1>
        HTML PROTECTOR
    </h1>

    <p class="subtitle">
        Protect • Minify • Obfuscate • Preview
    </p>

    <div class="developer">
        Developed by
        <strong>Miraj Hackz</strong>
    </div>

</header>


<!-- MAIN -->

<div class="container">

    <!-- STATS -->

    <div class="stats">

        <div class="stat">
            <div class="stat-icon">⚡</div>
            <strong>INSTANT</strong>
            <span>Processing</span>
        </div>

        <div class="stat">
            <div class="stat-icon">🔐</div>
            <strong>PRIVATE</strong>
            <span>Client Side</span>
        </div>

        <div class="stat">
            <div class="stat-icon">🚀</div>
            <strong>FAST</strong>
            <span>No Upload</span>
        </div>

        <div class="stat">
            <div class="stat-icon">💎</div>
            <strong>PREMIUM</strong>
            <span>Experience</span>
        </div>

    </div>


    <!-- APP -->

    <section class="app">

        <div class="app-header">

            <div class="app-title">
                <span class="live-dot"></span>
                Protector Workspace
            </div>

            <div class="security">
                🔒 CLIENT-SIDE
            </div>

        </div>


        <!-- FILE DROP -->

        <div
            class="drop-zone"
            id="dropZone">

            📁 Drag & Drop your
            <b>.html</b> file here

            or

            <label
                class="file-label"
                for="fileInput">
                Browse File
            </label>

            <input
                type="file"
                id="fileInput"
                accept=".html,.htm">

        </div>


        <!-- SCAN -->

        <div
            class="scan"
            id="scan">
        </div>


        <!-- EDITORS -->

        <div class="editors">

            <div>

                <div class="editor-title">

                    <span>
                        📥 SOURCE HTML
                    </span>

                    <span
                        class="counter"
                        id="inputCount">
                        0 characters
                    </span>
